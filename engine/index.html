<!doctype html>
<html><head><meta charset="utf-8"><title>film engine</title>
<style>
@font-face { font-family: "FilmHand"; src: url("fonts/hand.ttf"); }
@font-face { font-family: "FilmDigit"; src: url("fonts/digit.ttf"); }
@font-face { font-family: "FilmRound"; src: url("fonts/round.ttf"); font-weight: 100 900; }
html,body { margin:0; background:#000; }
canvas { display:block; width:100vw; height:auto; }
</style></head>
<body><canvas id="film"></canvas>
<script src="core.js"></script>
<script src="character.js"></script>
<script src="sets.js"></script>
<script src="overlay.js"></script>
<script src="inserts.js"></script>
<script src="main.js"></script>
<script>
// Interactive preview: open with ?film=../examples/film.json&t=12
(async () => {
  const q = new URLSearchParams(location.search);
  if (!q.get('film')) return;
  const film = await (await fetch(q.get('film'))).json();
  await document.fonts.ready;
  const dur = setup(film, 1280);
  let t = parseFloat(q.get('t') || '0'), start = performance.now() - t * 1000;
  const loop = () => { t = ((performance.now() - start) / 1000) % dur; drawFrame(t); requestAnimationFrame(loop); };
  loop();
})();
</script>
</body></html>
